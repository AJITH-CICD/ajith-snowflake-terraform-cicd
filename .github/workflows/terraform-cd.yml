
name: Terraform CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: snowflake-production
  cancel-in-progress: false

jobs:

  terraform-cd:

    runs-on: ubuntu-latest

    environment:
      name: snowflake-production

    steps:

      # 1. Checkout the code from main
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      # 3. Initialize Terraform
      - name: Terraform Init
        run: terraform init -input=false
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}

      # 4. Terraform Format Check
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # 5. Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 6. Create Terraform deployment plan
      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          TF_VAR_snowflake_organization: ${{ secrets.SNOWFLAKE_ORGANIZATION }}
          TF_VAR_snowflake_account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          TF_VAR_snowflake_user: ${{ secrets.SNOWFLAKE_USER }}
          TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_PASSWORD }}

      # 7. Apply Terraform plan to Snowflake
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          TF_VAR_snowflake_organization: ${{ secrets.SNOWFLAKE_ORGANIZATION }}
          TF_VAR_snowflake_account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          TF_VAR_snowflake_user: ${{ secrets.SNOWFLAKE_USER }}
          TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_PASSWORD }}

      # 8. Display Terraform outputs
      - name: Terraform Output
        run: terraform output
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
